#
# Build matrix: every push/PR compiles both packages against official
# OpenWrt SDKs for all supported branches and both test architectures.

name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  host-unit:
    runs-on: ubuntu-latest
    name: Host unit tests
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsodium-dev
      - name: Build and run unit tests
        run: ./tests/host-build.sh

  sdk-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ver: [ "23.05", "24.10", "master" ]
        target: [ "x86/64", "mediatek/filogic" ]
    name: SDK ${{ matrix.ver }} / ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd binutils

      - name: Build in SDK
        run: ./scripts/ci-sdk-build.sh "${{ matrix.ver }}" "${{ matrix.target }}" "$GITHUB_WORKSPACE"

      - name: Upload ipks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # artifact names must not contain '/' (from x86/64 etc.)
          name: ipk-${{ matrix.ver }}-${{ replace(matrix.target, '/', '-') }}
          path: |
            /tmp/sdk/bin/packages/**/openmeshd*.ipk
            /tmp/sdk/bin/packages/**/luci-app-openmesh*.ipk
            /tmp/sdk/bin/packages/**/openmeshd*.apk
            /tmp/sdk/bin/packages/**/luci-app-openmesh*.apk
          if-no-files-found: warn
